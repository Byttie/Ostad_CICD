deploy:
    needs: test
    runs-on: self-hosted 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # THIS IS THE MISSING STEP: It guarantees 'npm' is found
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Download test results
        uses: actions/download-artifact@v4
        with:
          name: test-results-artifact

      - name: Display artifact content
        run: cat test-results.txt

      - name: Install production dependencies
        run: npm install --production

      # Ensure pm2 is installed locally for the runner, then deploy
      - name: Deploy application
        run: |
          npm install -g pm2
          pm2 restart app || pm2 start index.js --name app
          pm2 save